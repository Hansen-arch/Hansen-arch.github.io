site_name: "Reihan Apriandi"
site_description: "Portfolio of Reihan Apriandi, forestry undergraduate at Universitas Riau. GIS analysis, remote sensing, land cover monitoring, satellite observation coverage, and forest field surveys."
site_author: "Reihan Apriandi"
site_url: "https://hansen-arch.github.io/"

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/invert-colors
        name: Invert to black
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/invert-colors
        name: Invert to white paper
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.footer
    - content.code.copy

extra_css:
  - assets/css/onebit.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hansen-arch
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/reihan-apriandi-700845266/
      name: LinkedIn
    - icon: material/email
      link: mailto:apriandireihan@gmail.com
      name: Email

copyright: "© 2026 Reihan Apriandi / Field notes"

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - meta
  - mkdocs-jupyter

nav:
  - Home: index.md
  - Projects:
    - "All Projects": projects/index.md
    - "Palm Tree Counting": projects/palm-tree-counting.md
    - "BioSift": projects/biosift.md
    - "Flood Coverage": projects/flood-coverage.md
    - "Urban Heat Island": projects/urban-heat-island.md
    - "Urban Green Space Change": projects/urban-green-space.md
    - "Species Distribution Models": projects/species-distribution-models.md
  - Experience: experience.md
  - Contact: contact.md

not_in_nav: |
  robots.txt
