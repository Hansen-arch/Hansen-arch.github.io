<script type="application/ld+json">
{

  "url": "{{ config.site_url }}",
  "image": "{{ config.site_url }}assets/images/profile.png",

  "alumniOf": {
    "@type": "CollegeOrUniversity",

  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Pekanbaru",

    "Geographic Information Systems",

    "Google Earth Engine",

    "Forest Monitoring",
    "Above-Ground Biomass",

    "https://www.linkedin.com/in/reihan-apriandi-700845266/"

<meta name="theme-color" content="#ffffff">

{% block scripts %}
{{ super() }}
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="ink-duotone" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 1"/>
        <feFuncG type="table" tableValues="0 1"/>
        <feFuncB type="table" tableValues="0 1"/>
      </feComponentTransfer>
    </filter>
    <filter id="ink-duotone-dark" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="1 0"/>
        <feFuncG type="table" tableValues="1 0"/>
        <feFuncB type="table" tableValues="1 0"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
{% endblock %}
